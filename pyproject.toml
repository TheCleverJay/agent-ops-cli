[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-ops-cli"
version = "0.1.0"
description = "Local CLI for AI agent host ops: context budget, slow-command watchdog, env audit, log digest, routine lint"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "YuanAqi" }]
keywords = ["agent", "ops", "cli", "timeout", "context", "watchdog", "health"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Systems Administration",
  "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/YuanAqi/agent-ops-cli"
Repository = "https://github.com/YuanAqi/agent-ops-cli"
Issues = "https://github.com/YuanAqi/agent-ops-cli/issues"
Changelog = "https://github.com/YuanAqi/agent-ops-cli/blob/main/CHANGELOG.md"

[project.scripts]
agent-ops = "agent_ops_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
